plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'checkstyle'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'org.sonarqube' version '4.4.1.3373'
}

repositories {
    mavenCentral()
}

group = 'com.github.wenhao'
version = '4.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(javaBaseline))
    }
    withSourcesJar()
    withJavadocJar()
}

idea {
    project {
        vcs = 'Git'
        jdkName = javaBaseline
    }
    module {
        jdkName = javaBaseline
    }
}

dependencies {
    compileOnly "org.springframework.data:spring-data-jpa:$springDataJpaVersion"
    compileOnly "jakarta.persistence:jakarta.persistence-api:$jpaVersion"

    testImplementation platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.apache.commons:commons-lang3'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(Integer.parseInt(javaBaseline))
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
    }
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.21.4'
    ignoreFailures = false
    configFile = file("$project.rootDir/config/checkstyle/checkstyle.xml")
    sourceSets = [sourceSets.main]
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }

        rule {
            enabled = true
            element = 'PACKAGE'
            includes = ['com.*']

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
            limit {
                counter = 'CLASS'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }
    dependsOn(jacocoTestReport)
}

license {
    header = rootProject.file('config/copyright/copyright.header')
    excludes(['**/*.properties', '**/*.yml', '**/*.yaml', '**/*.md', '**/*.xml'])
    strictCheck = true
}

check.dependsOn jacocoTestCoverageVerification
check.dependsOn licenseFormat

sonarqube {
    properties {
        property 'sonar.gradle.skipCompile', 'true'
        property 'sonar.projectName', 'A JPA Query By Specification framework.'
        property 'sonar.projectKey', 'wenhao_jpa-spec'
    }
}

def pomConfig = {
    licenses {
        license {
            name 'MIT License'
            url 'http://www.opensource.org/licenses/mit-license.php'
            distribution 'repo'
        }
    }

    scm {
        url 'https://github.com/wenhao/jpa-spec'
        connection 'https://github.com/wenhao/jpa-spec.git'
        developerConnection 'git@github.com:wenhao/jpa-spec.git'
    }

    developers {
        developer {
            id 'wenhao'
            name 'Hao Wen'
            email 'wenhao@126.com'
            organization 'Hao Wen'
            roles {
                role 'Developer'
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.github.wenhao'
            artifactId = 'jpa-spec'
            version = project.version
            pom.withXml {
                def root = asNode()
                root.appendNode('description', 'A JPA Query By Specification framework.')
                root.appendNode('name', 'jpa-spec')
                root.appendNode('url', 'https://github.com/wenhao/jpa-spec')
                root.appendNode('inceptionYear', '2016')
                root.children().last() + pomConfig
            }
        }
    }
}

ext.isReleaseVersion = !version.endsWith('SNAPSHOT')

signing {
    required = { isReleaseVersion && gradle.taskGraph.hasTask('publish') }
    sign publishing.publications.maven
}

if (file('.git/hooks').exists()) {
    copy {
        from './config/githooks/'
        into './.git/hooks/'
        filePermissions {
            unix('0755')
        }
    }
}
